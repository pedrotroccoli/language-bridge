name: Publish CLI

# Publishes @language-bridge/cli to npm on a cli-v* tag (e.g. cli-v0.1.0).
# Requires an NPM_TOKEN secret with publish rights to the @language-bridge scope.
on:
  push:
    tags: [ "cli-v*" ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # A cli-vX.Y.Z tag must publish exactly package.json's version — fail fast
      # on a mismatched or forgotten version bump.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          tag="${GITHUB_REF_NAME#cli-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag cli-v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs build + tests; --provenance requires id-token: write.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    permissions:
      contents: read
      id-token: write
