# token_digest is the SHA-256 of the raw token used in tests. The raw values are:
#   write     -> "test-save-missing-token"  (read + read_drafts + write)
#   read_only -> "test-read-only-token"      (read)
save_missing:
  project: main_app
  creator: admin
  name: CI write
  scopes: [ read, read_drafts, write ]
  token_digest: <%= Digest::SHA256.hexdigest("test-save-missing-token") %>

read_only:
  project: main_app
  creator: admin
  name: CI read only
  scopes: [ read ]
  token_digest: <%= Digest::SHA256.hexdigest("test-read-only-token") %>
