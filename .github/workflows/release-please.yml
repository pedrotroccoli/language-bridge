name: release-please

# Watches main and maintains one release PR per component (server + cli): each
# conventional commit updates the PR's changelog and version bump; merging it
# creates the tag (v* / cli-v*) and the GitHub Release, which in turn trigger
# docker-publish / cli-publish.
#
# RELEASE_PLEASE_TOKEN must be a PAT (contents + pull-requests write): tags
# created with the default GITHUB_TOKEN would not trigger the publish
# workflows (GitHub suppresses workflow runs for events it creates itself).
# No GITHUB_TOKEN fallback on purpose — a missing or expired PAT must fail
# this job loudly, not cut a release whose image and package never ship.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
